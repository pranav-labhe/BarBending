name: BBS Offline App CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bytecode compile check
        run: python -m compileall -q app tests

      - name: Run pytest suite
        run: pytest -v

  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Containerfile
        run: docker build -f Containerfile -t bbs-offline-app:ci .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name bbs_ci -p 8000:8000 bbs-offline-app:ci
          trap "docker rm -f bbs_ci || true" EXIT
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs bbs_ci
          exit 1
